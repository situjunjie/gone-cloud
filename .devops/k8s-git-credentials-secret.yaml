# Git凭证Secret配置
# 用于Pipeline在K8s Pod中访问Git仓库

apiVersion: v1
kind: Secret
metadata:
  name: git-credentials
  namespace: devops-build
type: Opaque
stringData:
  # Git仓库认证用户名
  username: "your-git-username"

  # Git仓库认证密码或Token
  # 建议使用Personal Access Token而不是密码
  password: "your-git-password-or-token"

  # Git提交时使用的用户名
  user-name: "Pipeline Bot"

  # Git提交时使用的邮箱
  user-email: "bot@pipeline.local"

---
# 创建命令:
# kubectl create secret generic git-credentials \
#   --from-literal=username='your-username' \
#   --from-literal=password='your-password' \
#   --from-literal=user-name='Pipeline Bot' \
#   --from-literal=user-email='bot@pipeline.local' \
#   -n devops-build

# 或使用文件:
# kubectl apply -f k8s-git-credentials-secret.yaml

# 查看Secret:
# kubectl get secret git-credentials -n devops-build

# 删除Secret:
# kubectl delete secret git-credentials -n devops-build
