# Pipeline示例 - 使用K8s构建集群和Checkout step
# 展示重构后的pipeline执行方式

sources:
  gone_cloud_repo:
    type: gitlab
    name: Gone Cloud Repository
    endpoint: https://gitlab.gigimed.cn/gigi/gone-cloud.git
    branch: master-gigi

stages:
  build_stage:
    name: 构建阶段
    jobs:
      checkout_and_build_job:
        name: 检出代码并编译
        runsOn:
          group: kubernetes/build-cluster
          container: registry.gigimed.cn/devops/builder:latest
        timeoutSeconds: 3600
        steps:
          code_merge_step:
            name: 代码合并检出
            step: CodeMerge
            with:
              baseBranch: master-gigi
              targetBranch: master-gigi
              branches: []
              pushOnSuccess: false

          show_info_step:
            name: 显示仓库信息
            step: Command
            with:
              run: |
                echo "=== 当前目录 ==="
                pwd
                echo ""
                echo "=== Git信息 ==="
                git log -1 --oneline
                git branch --show-current
                echo ""
                echo "=== 文件列表 ==="
                ls -la

          compile_step:
            name: 编译项目
            step: Command
            with:
              run: |
                echo "=== 开始编译 ==="
                cd yudao-server
                mvn clean package -DskipTests -T 4
                echo "=== 编译完成 ==="
                ls -lh target/*.jar

      build_image_job:
        name: 构建Docker镜像
        needs:
          - checkout_and_build_job
        runsOn:
          group: kubernetes/build-cluster
        timeoutSeconds: 1800
        steps:
          kaniko_build_step:
            name: Kaniko构建镜像
            step: KanikoBuild
            with:
              dockerfile: yudao-server/Dockerfile
              context: ./yudao-server
              imageTag: registry.gigimed.cn/gigi/yudao-server:${PIPELINE_RUN_ID}
              cache: true
              buildArgs:
                - JAR_FILE=target/yudao-server.jar

  deploy_stage:
    name: 部署阶段
    jobs:
      approval_job:
        name: 部署审批
        steps:
          approval_step:
            name: 审批部署
            step: Approval
            with:
              processDefinitionKey: pipeline-deploy-approval

      deploy_to_dev_job:
        name: 部署到开发环境
        needs:
          - approval_job
        steps:
          deploy_step:
            name: K8s部署
            step: K8sDeploy
            with:
              deployMode: RAW_MANIFEST
              containerName: yudao-server
              image: registry.gigimed.cn/gigi/yudao-server:${PIPELINE_RUN_ID}
              rolloutTimeoutSeconds: 300
              manifestYaml: |
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: yudao-server
                  namespace: dev
                spec:
                  replicas: 1
                  selector:
                    matchLabels:
                      app: yudao-server
                  template:
                    metadata:
                      labels:
                        app: yudao-server
                    spec:
                      containers:
                      - name: yudao-server
                        image: ${IMAGE}
                        ports:
                        - containerPort: 48080
