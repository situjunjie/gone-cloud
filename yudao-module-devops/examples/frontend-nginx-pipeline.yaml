sources:
  frontend_repo:
    type: gitlab
    name: Frontend Repository
    endpoint: https://gitlab.example.com/your-group/your-frontend.git
    branch: main

stages:
  build_stage:
    name: Frontend Build
    jobs:
      frontend_build_job:
        name: Build Frontend Assets
        runsOn:
          group: local-docker/default
          container: gone-cloud/pipeline-builder:java17-node24-maven3.9
        timeoutSeconds: 3600
        steps:
          install_and_build_step:
            name: Install Dependencies And Build
            step: Command
            with:
              logMode: CONTAINER
              env:
                PNPM_STORE_PATH: /root/.pnpm-store
              run: |
                set -eu
                pwd
                ls -la
                if [ -f pnpm-lock.yaml ] && grep -q 'registry.npmmirror.com' pnpm-lock.yaml; then
                  pnpm config set registry https://registry.npmmirror.com/
                else
                  pnpm config set registry https://mirrors.cloud.tencent.com/npm/
                fi
                pnpm install --reporter=append-only --frozen-lockfile
                pnpm run --reporter=append-only build:prod
                test -d dist

          prepare_nginx_dockerfile_step:
            name: Prepare Nginx Dockerfile
            step: Command
            with:
              run: |
                set -eu
                mkdir -p .deploy/nginx
                cat > .deploy/nginx/default.conf <<'EOF'
                server {
                  listen 80;
                  server_name _;
                  root /usr/share/nginx/html;
                  index index.html;

                  location / {
                    try_files $uri $uri/ /index.html;
                  }
                }
                EOF
                cat > .deploy/nginx/Dockerfile <<'EOF'
                FROM nginx:1.27-alpine
                COPY .deploy/nginx/default.conf /etc/nginx/conf.d/default.conf
                COPY dist/ /usr/share/nginx/html/
                EXPOSE 80
                CMD ["nginx", "-g", "daemon off;"]
                EOF

  docker_stage:
    name: Docker Build And Push
    jobs:
      nginx_image_job:
        name: Build And Push Nginx Image
        needs:
          - frontend_build_job
        steps:
          build_nginx_image_step:
            name: Build Frontend Nginx Image
            step: PrivateRegistryDockerBuild
            with:
              artifact: frontend_nginx_image
              image: registry.example.com/your-namespace/your-frontend:${PIPELINE_RUN_ID}
              certificate:
                type: usernamePassword
                username: <your-registry-username>
                password: <your-registry-password>
              dockerfilePath: .deploy/nginx/Dockerfile
              contextPath: .
              noCache: false

  deploy_stage:
    name: Deploy To Kubernetes
    jobs:
      k8s_deploy_job:
        name: Deploy Frontend To K8s
        needs:
          - nginx_image_job
        steps:
          k8s_deploy_step:
            name: Apply Frontend Deployment
            step: K8sDeploy
            with:
              deployMode: RAW_MANIFEST
              containerName: frontend-nginx
              image: registry.example.com/your-namespace/your-frontend:${PIPELINE_RUN_ID}
              replicas: 2
              rolloutTimeoutSeconds: 300
              manifestYaml: |
                apiVersion: apps/v1
                kind: Deployment
                metadata:
                  name: frontend-web
                  namespace: ${NAMESPACE}
                  labels:
                    app: frontend-web
                spec:
                  replicas: 2
                  selector:
                    matchLabels:
                      app: frontend-web
                  template:
                    metadata:
                      labels:
                        app: frontend-web
                    spec:
                      containers:
                        - name: frontend-nginx
                          image: ${IMAGE}
                          imagePullPolicy: IfNotPresent
                          ports:
                            - containerPort: 80
