--- #################### DEVOPS 相关配置 ####################
devops:
  config:
    build:
      default-executor: KUBERNETES
      cluster:
        environment-id: 9
        namespace: devops-build
        default-image: maven:3.8-openjdk-17

        # Kaniko 执行器镜像。默认值是 gcr.io，本集群无法访问，必须指向可用的镜像源，
        # 否则 KanikoBuild 步骤的 kaniko sidecar 拉取失败，Pod 永远不就绪（等待 Pod Ready 超时）。
        kaniko-image: gcr.m.daocloud.io/kaniko-project/executor:v1.23.2-debug

        # 使用 local-path 的共享 PVC
        workspace-storage:
          type: SHARED_PVC
          shared-pvc-name: pipeline-shared-workspace
          storage-class-name: local-path

        # ⚠️ 此段与 yudao-server/src/main/resources/application.yaml 中的同名配置是两份独立副本，
        # 必须同步修改。单体启动读 yudao-server 那份，devops-server 独立启动读这份。
        #
        # 资源配额按容器分别应用：builder 与 kaniko sidecar 各拿一份，
        # 因此 Pod 实际的 requests/limits 是这个配置的 2 倍（见 K8sPipelineJobRuntimeManager#buildPod）。
        # 实际执行构建的是 kaniko sidecar；builder 只跑 CodeMerge 之类的平台步骤，
        # 构建期间它几乎不占 CPU，但它的 request 同样会被预留。
        #
        # 容量依据（构建节点 environment-id=9，单节点 k3s）：
        #   节点：80 核 / 501Gi 可分配，命名空间内无 ResourceQuota/LimitRange。
        #   实测：同一节点上起一个 Pod 跑忙循环，请求 8/24/40 核时实际都拿到
        #         7.99/23.95/39.97 核，限流 0/80 周期 —— 也就是说 CPU 是够的。
        #   （注意：该节点 kubectl top node / /proc/stat 会报 ~99% CPU 占用且 loadavg ~400，
        #    与所有 Pod 合计仅 ~200m 的事实矛盾，是这台机器的计数器失真，不代表真实负载。）
        #
        # 并发按最多 3 条流水线同时构建来配：
        #   CPU  limit  ：3 × 24 核 = 72 核，留 8 核给 k3s/ingress 及同节点其它 Pod（它们目前只用 ~200m）。
        #                 之前的瓶颈就是 limit 太小：2000m 时 63% 的 CFS 周期被限流
        #                 （nr_throttled 8739/13798），一次前端镜像构建跑了 28 分钟。
        #   CPU  request：只影响调度与竞争时的 CFS 权重。节点空闲，给 4 核保证能调度即可，
        #                 3 条流水线共预留 3 × 2 × 4 = 24 核。
        #   MEM  limit  ：实测峰值 11.7Gi（当时上限 16Gi，0 次 OOMKill）。
        #                 kaniko 打快照时要整份持有文件系统元数据，镜像变大会上浮，
        #                 且前端 Dockerfile 写死了 --max_old_space_size=10240，因此给 32Gi 余量。
        #   MEM  request：典型工作集，3 条流水线共预留 3 × 2 × 8 = 48Gi。
        resource-quota:
          cpu-request: 4000m
          memory-request: 8Gi
          cpu-limit: 24000m
          memory-limit: 32Gi
        pod-cleanup:
          strategy: IMMEDIATE


xxl:
  job:
    executor:
      appname: ${spring.application.name} # 执行器 AppName
      logpath: ${user.home}/logs/xxl-job/${spring.application.name} # 执行器运行日志文件存储磁盘路径
    accessToken: default_token # 执行器通讯TOKEN

