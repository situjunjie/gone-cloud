# DevOps 模块配置示例
# 将此配置添加到 application.yml 或 application-dev.yml

devops:
  config:
    build:
      # 默认执行器类型: DOCKER, KUBERNETES
      default-executor: KUBERNETES

      cluster:
        # K8s 环境 ID（需要先在系统中创建 K8s 环境）
        environment-id: 1

        # 构建任务命名空间
        namespace: devops-build

        # 默认构建镜像
        default-image: maven:3.8-openjdk-17

        # Kaniko 执行器镜像
        kaniko-image: gcr.io/kaniko-project/executor:v1.23.2-debug

        # 工作空间存储配置
        workspace-storage:
          # 存储类型: SHARED_PVC, DYNAMIC_PVC, EMPTY_DIR
          type: SHARED_PVC  # 使用共享PVC实现跨job的workspace复用
          # 共享 PVC 名称（type=SHARED_PVC 时使用）
          shared-pvc-name: devops-workspace
          # 动态 PVC 存储类名称（type=DYNAMIC_PVC 时使用）
          storage-class-name: local-path
          # PVC 容量请求
          storage-size: 10Gi
          # local-path 单节点存储使用 ReadWriteOnce；跨节点共享需要支持 RWX 的存储类
          access-mode: ReadWriteOnce
          # EMPTY_DIR / DYNAMIC_PVC 如需依赖缓存，显式填写已有的缓存 PVC
          # cache-pvc-name: pipeline-caches

        # 资源配额
        resource-quota:
          cpu-request: 1000m
          memory-request: 2Gi
          cpu-limit: 2000m
          memory-limit: 4Gi

        # Pod 清理配置
        pod-cleanup:
          # 清理策略: IMMEDIATE（立即清理）, RETAIN（保留调试）
          strategy: IMMEDIATE
          # 保留时长（分钟），仅在 strategy=RETAIN 时生效
          retention-minutes: 30
          # 是否保留失败的 Pod 用于调试
          retain-failed-pods: true
